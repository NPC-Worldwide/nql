[package]
name = "nql"
version = "0.1.2"
edition = "2021"
authors = ["NPC Worldwide <info@npcworldwi.de>"]
description = "NQL — SQL compiler with AI function calls targeting multiple databases"
license = "MIT"
readme = "README.md"
repository = "https://github.com/npc-worldwide/nql"
homepage = "https://github.com/npc-worldwide/nql"
documentation = "https://docs.rs/nql"
keywords = ["sql", "ai", "llm", "compiler", "dbt"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "nql"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
